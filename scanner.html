<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <title>Scanner - Raquel Semijoias</title>

  <!-- Leitura de texto da etiqueta -->
  <script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f5f3;
      color: #333;
    }

    .topo {
      background: #b76e79;
      color: white;
      text-align: center;
      padding: 18px;
    }

    .topo h1 {
      margin: 0;
      font-size: 22px;
    }

    .topo p {
      margin: 6px 0 0;
      font-size: 13px;
    }

    .conteudo {
      max-width: 650px;
      margin: auto;
      padding: 15px;
    }

    .camera-box {
      background: #222;
      border-radius: 15px;
      padding: 12px;
    }

    .instrucao {
      color: white;
      text-align: center;
      font-size: 14px;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .video-area {
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      background: black;
    }

    video {
      width: 100%;
      min-height: 320px;
      max-height: 500px;
      display: block;
      object-fit: cover;
      background: black;
    }

    /*
      A linha escrita da etiqueta deve ficar
      dentro deste retângulo.
    */
    .moldura {
      position: absolute;
      left: 5%;
      right: 5%;
      top: 52%;
      height: 24%;
      border: 3px solid white;
      border-radius: 10px;
      pointer-events: none;
    }

    .texto-moldura {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 44%;
      color: white;
      text-align: center;
      font-size: 12px;
      text-shadow: 0 1px 4px black;
      pointer-events: none;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      margin-top: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .principal {
      background: #b76e79;
      color: white;
    }

    .capturar {
      background: #d8a8af;
      color: #442d31;
    }

    .secundario {
      background: white;
      color: #72535a;
    }

    .status {
      background: white;
      margin-top: 15px;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      line-height: 1.5;
    }

    .sucesso {
      color: green;
      font-weight: bold;
    }

    .erro {
      color: #b00020;
      font-weight: bold;
    }

    .codigo {
      font-size: 20px;
      font-weight: bold;
      margin-top: 8px;
      word-break: break-all;
    }

    .preco {
      font-size: 18px;
      margin-top: 5px;
    }

    .manual {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-top: 15px;
    }

    .manual h3 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
      text-transform: uppercase;
    }

    canvas {
      display: none;
    }
  </style>
</head>

<body>

  <div class="topo">
    <h1>📷 Scanner</h1>
    <p>Raquel Semijoias</p>
  </div>

  <div class="conteudo">

    <div class="camera-box">

      <div class="instrucao">
        Enquadre principalmente a <b>linha escrita abaixo do código de barras</b>.
      </div>

      <div class="video-area">

        <video
          id="video"
          autoplay
          muted
          playsinline
        ></video>

        <div class="texto-moldura">
          POSICIONE O CÓDIGO ESCRITO AQUI
        </div>

        <div class="moldura"></div>

      </div>

      <button
        class="principal"
        onclick="abrirCamera()"
      >
        📷 Abrir câmera
      </button>

      <button
        id="btnCapturar"
        class="capturar"
        onclick="capturarEtiqueta()"
        disabled
      >
        🔎 Ler etiqueta
      </button>

      <button
        class="secundario"
        onclick="fecharCamera()"
      >
        ✕ Fechar câmera
      </button>

    </div>

    <div
      id="status"
      class="status"
    >
      Abra a câmera e posicione a linha escrita da etiqueta dentro da moldura.
    </div>

    <div class="manual">

      <h3>Digitar código manualmente</h3>

      <input
        id="codigoManual"
        type="text"
        placeholder="Ex.: 23118843AT04890"
      >

      <button
        class="principal"
        onclick="usarCodigoManual()"
      >
        Usar código
      </button>

    </div>

    <canvas id="canvas"></canvas>

  </div>

  <script>

    let stream = null;
    let processando = false;

    const parametros =
      new URLSearchParams(window.location.search);

    const URL_RETORNO =
      parametros.get("retorno");


    async function abrirCamera() {

      if (!URL_RETORNO) {

        mostrarErro(
          "Abra o scanner através do sistema Raquel Semijoias."
        );

        return;
      }

      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {

        mostrarErro(
          "Este navegador não permite acesso à câmera."
        );

        return;
      }


      fecharCamera();


      try {

        stream =
          await navigator.mediaDevices.getUserMedia({

            video: {

              facingMode: {
                ideal: "environment"
              },

              width: {
                ideal: 1920
              },

              height: {
                ideal: 1080
              },

              focusMode: {
                ideal: "continuous"
              }

            },

            audio: false

          });


        const video =
          document.getElementById("video");

        video.srcObject = stream;

        await video.play();


        document.getElementById(
          "btnCapturar"
        ).disabled = false;


        mostrarStatus(
          "Câmera aberta. Aproxime a etiqueta e coloque a linha escrita dentro da moldura."
        );

      }
      catch (erro) {

        console.log(erro);

        if (
          erro.name === "NotAllowedError"
        ) {

          mostrarErro(
            "Permita o acesso à câmera para continuar."
          );

        }
        else {

          mostrarErro(
            "Não foi possível abrir a câmera."
          );

        }

      }

    }


    async function capturarEtiqueta() {

      if (processando) {
        return;
      }


      const video =
        document.getElementById("video");


      if (
        !video.videoWidth ||
        !video.videoHeight
      ) {

        mostrarErro(
          "A câmera ainda não está pronta."
        );

        return;
      }


      processando = true;


      document.getElementById(
        "btnCapturar"
      ).disabled = true;


      mostrarStatus(
        "🔎 Lendo a etiqueta... aguarde alguns segundos."
      );


      try {

        const canvas =
          document.getElementById("canvas");

        const ctx =
          canvas.getContext("2d");


        /*
         * Capturamos principalmente a região
         * central/inferior onde está a linha
         * escrita abaixo do código de barras.
         */
        const larguraOriginal =
          video.videoWidth;

        const alturaOriginal =
          video.videoHeight;


        const x =
          Math.floor(
            larguraOriginal * 0.05
          );

        const y =
          Math.floor(
            alturaOriginal * 0.45
          );

        const largura =
          Math.floor(
            larguraOriginal * 0.90
          );

        const altura =
          Math.floor(
            alturaOriginal * 0.35
          );


        /*
         * Aumentamos a imagem para ajudar
         * o reconhecimento das letras pequenas.
         */
        canvas.width =
          largura * 2;

        canvas.height =
          altura * 2;


        ctx.drawImage(
          video,
          x,
          y,
          largura,
          altura,
          0,
          0,
          canvas.width,
          canvas.height
        );


        melhorarImagem(
          ctx,
          canvas.width,
          canvas.height
        );


        const resultado =
          await Tesseract.recognize(
            canvas,
            "eng",
            {
              logger: function(m) {

                if (
                  m.status ===
                  "recognizing text"
                ) {

                  const progresso =
                    Math.round(
                      (m.progress || 0) * 100
                    );

                  mostrarStatus(
                    "🔎 Lendo etiqueta... " +
                    progresso +
                    "%"
                  );

                }

              }
            }
          );


        const texto =
          resultado.data.text || "";


        console.log(
          "Texto OCR:",
          texto
        );


        const codigo =
          extrairCodigo(texto);


        if (!codigo) {

          mostrarErro(
            "Não consegui identificar o código completo. Aproxime um pouco mais a etiqueta, deixe a linha escrita bem nítida e tente novamente."
          );


          processando = false;

          document.getElementById(
            "btnCapturar"
          ).disabled = false;

          return;
        }


        const preco =
          calcularPreco(codigo);


        mostrarSucesso(
          codigo,
          preco
        );


        if (navigator.vibrate) {

          navigator.vibrate(
            [100, 60, 100]
          );

        }


        fecharCamera();


        setTimeout(
          function() {

            retornarCodigo(
              codigo
            );

          },
          1200
        );

      }
      catch (erro) {

        console.log(erro);

        mostrarErro(
          "Ocorreu um erro ao tentar ler a etiqueta. Tente novamente."
        );


        processando = false;


        document.getElementById(
          "btnCapturar"
        ).disabled = false;

      }

    }


    function melhorarImagem(
      ctx,
      largura,
      altura
    ) {

      const imagem =
        ctx.getImageData(
          0,
          0,
          largura,
          altura
        );


      const dados =
        imagem.data;


      for (
        let i = 0;
        i < dados.length;
        i += 4
      ) {

        const cinza =
          (
            dados[i] +
            dados[i + 1] +
            dados[i + 2]
          ) / 3;


        /*
         * Alto contraste.
         */
        const valor =
          cinza > 145
            ? 255
            : 0;


        dados[i] =
          valor;

        dados[i + 1] =
          valor;

        dados[i + 2] =
          valor;

      }


      ctx.putImageData(
        imagem,
        0,
        0
      );

    }


    function extrairCodigo(texto) {

      let limpo =
        String(texto)
          .toUpperCase()
          .replace(/\s+/g, "")
          .replace(/[^A-Z0-9]/g, "");


      console.log(
        "Texto limpo:",
        limpo
      );


      /*
       * Procuramos:
       *
       * 8 números iniciais
       * +
       * letras/números opcionais
       * +
       * 5 números finais
       *
       * Exemplos aceitos:
       *
       * 23118843AT04890
       * 2311884304890
       * 12345678AP07290
       * 12345678ABC05690
       */


      const correspondencias =
        limpo.match(
          /\d{8}[A-Z0-9]{0,8}\d{5}/g
        );


      if (
        !correspondencias ||
        correspondencias.length === 0
      ) {

        return "";
      }


      /*
       * Damos preferência ao código
       * de tamanho mais plausível.
       */
      correspondencias.sort(
        function(a, b) {

          return (
            Math.abs(a.length - 15) -
            Math.abs(b.length - 15)
          );

        }
      );


      return correspondencias[0];

    }


    function calcularPreco(codigo) {

      if (!codigo) {
        return "";
      }


      const final =
        codigo.slice(-5);


      if (
        !/^\d{5}$/.test(final)
      ) {

        return "";

      }


      return (
        Number(final) / 100
      ).toLocaleString(
        "pt-BR",
        {
          style: "currency",
          currency: "BRL"
        }
      );

    }


    function usarCodigoManual() {

      let codigo =
        document
          .getElementById(
            "codigoManual"
          )
          .value
          .trim()
          .toUpperCase()
          .replace(/\s+/g, "");


      if (!codigo) {

        mostrarErro(
          "Digite o código da etiqueta."
        );

        return;
      }


      if (
        codigo.length < 13
      ) {

        mostrarErro(
          "O código parece incompleto."
        );

        return;
      }


      const final =
        codigo.slice(-5);


      if (
        !/^\d{5}$/.test(final)
      ) {

        mostrarErro(
          "Os últimos 5 caracteres precisam ser números."
        );

        return;
      }


      retornarCodigo(
        codigo
      );

    }


    function retornarCodigo(codigo) {

      if (!URL_RETORNO) {

        mostrarErro(
          "Não foi possível retornar ao sistema."
        );

        return;
      }


      const separador =
        URL_RETORNO.includes("?")
          ? "&"
          : "?";


      const destino =
        URL_RETORNO +
        separador +
        "tela=produto" +
        "&codigo=" +
        encodeURIComponent(
          codigo
        );


      window.location.href =
        destino;

    }


    function fecharCamera() {

      if (stream) {

        stream
          .getTracks()
          .forEach(
            function(track) {

              track.stop();

            }
          );

      }


      stream = null;


      const video =
        document.getElementById(
          "video"
        );


      if (video) {

        video.pause();

        video.srcObject = null;

      }


      const botao =
        document.getElementById(
          "btnCapturar"
        );


      if (botao) {

        botao.disabled = true;

      }

    }


    function mostrarStatus(texto) {

      const campo =
        document.getElementById(
          "status"
        );

      campo.className =
        "status";

      campo.innerHTML =
        texto;

    }


    function mostrarErro(texto) {

      const campo =
        document.getElementById(
          "status"
        );

      campo.className =
        "status erro";

      campo.innerHTML =
        texto;

    }


    function mostrarSucesso(
      codigo,
      preco
    ) {

      const campo =
        document.getElementById(
          "status"
        );

      campo.className =
        "status sucesso";


      campo.innerHTML =
        "✅ Código reconhecido" +
        "<div class='codigo'>" +
        codigo +
        "</div>" +
        (
          preco
            ? "<div class='preco'>" +
              preco +
              "</div>"
            : ""
        );

    }


    window.addEventListener(
      "beforeunload",
      fecharCamera
    );

  </script>

</body>
</html>
