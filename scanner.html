<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <title>Scanner - Raquel Semijoias</title>

  <script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f5f3;
      color: #333;
    }

    .topo {
      background: #B76E79;
      color: white;
      padding: 20px 15px;
      text-align: center;
    }

    .topo h1 {
      margin: 0;
      font-size: 22px;
    }

    .topo p {
      margin: 5px 0 0;
      font-size: 13px;
    }

    .conteudo {
      max-width: 650px;
      margin: auto;
      padding: 16px;
    }

    .scanner {
      background: #222;
      border-radius: 14px;
      padding: 12px;
    }

    .instrucao {
      color: white;
      text-align: center;
      font-size: 14px;
      margin: 5px 0 12px;
    }

    .video-area {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 10px;
      background: black;
    }

    video {
      display: block;
      width: 100%;
      min-height: 300px;
      max-height: 500px;
      object-fit: cover;
      background: black;
    }

    .moldura {
      position: absolute;
      left: 5%;
      right: 5%;
      top: 35%;
      height: 30%;
      border: 3px solid white;
      border-radius: 10px;
      pointer-events: none;
    }

    .linha {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 50%;
      height: 3px;
      background: white;
      box-shadow: 0 0 10px white;
      pointer-events: none;
    }

    .status {
      margin-top: 15px;
      background: white;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      line-height: 1.5;
    }

    .botao {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 15px;
      font-weight: bold;
      margin-top: 12px;
      cursor: pointer;
    }

    .principal {
      background: #B76E79;
      color: white;
    }

    .secundario {
      background: white;
      color: #72535a;
    }

    .erro {
      color: #b00020;
    }

    .sucesso {
      color: #168217;
    }
  </style>
</head>

<body>

  <div class="topo">
    <h1>📷 Scanner</h1>
    <p>Raquel Semijoias</p>
  </div>

  <div class="conteudo">

    <div class="scanner">

      <div class="instrucao">
        Centralize o código inteiro dentro da moldura
      </div>

      <div class="video-area">

        <video
          id="video"
          autoplay
          muted
          playsinline
        ></video>

        <div class="moldura"></div>
        <div class="linha"></div>

      </div>

      <button
        id="botaoIniciar"
        class="botao principal"
        onclick="iniciarScanner()"
      >
        📷 Abrir câmera
      </button>

      <button
        class="botao secundario"
        onclick="fecharScanner()"
      >
        ✕ Fechar câmera
      </button>

    </div>

    <div
      id="status"
      class="status"
    >
      Toque em "Abrir câmera".
    </div>

  </div>

  <script>

    let leitor = null;
    let stream = null;
    let lendo = false;
    let codigoEncontrado = false;

    const parametros =
      new URLSearchParams(
        window.location.search
      );

    const URL_RETORNO =
      parametros.get("retorno");


    async function iniciarScanner() {

      if (!URL_RETORNO) {

        mostrarErro(
          "Abra o scanner pelo sistema Raquel Semijoias."
        );

        return;
      }


      if (typeof ZXing === "undefined") {

        mostrarErro(
          "O leitor não carregou. Atualize a página."
        );

        return;
      }


      fecharScanner();

      codigoEncontrado = false;


      try {

        stream =
          await navigator.mediaDevices.getUserMedia({

            video: {

              facingMode: {
                ideal: "environment"
              },

              width: {
                ideal: 1920
              },

              height: {
                ideal: 1080
              }

            },

            audio: false

          });


        const video =
          document.getElementById("video");


        video.srcObject = stream;

        video.setAttribute(
          "playsinline",
          "true"
        );

        await video.play();


        lendo = true;


        mostrarStatus(
          "Câmera aberta. Enquadre o código COMPLETO."
        );


        /*
         * =================================================
         * FORÇA FORMATO CODE 128
         * =================================================
         */

        const hints =
          new Map();


        const formatos =
          [
            ZXing.BarcodeFormat.CODE_128,
            ZXing.BarcodeFormat.CODE_39,
            ZXing.BarcodeFormat.CODE_93
          ];


        hints.set(
          ZXing.DecodeHintType.POSSIBLE_FORMATS,
          formatos
        );


        hints.set(
          ZXing.DecodeHintType.TRY_HARDER,
          true
        );


        leitor =
          new ZXing.BrowserMultiFormatReader(
            hints
          );


        leitor.decodeFromVideoElementContinuously(

          video,

          function(resultado, erro) {

            if (
              !lendo ||
              codigoEncontrado
            ) {

              return;
            }


            if (resultado) {

              let codigo =
                "";


              if (
                typeof resultado.getText ===
                "function"
              ) {

                codigo =
                  resultado.getText();

              }

              else {

                codigo =
                  resultado.text || "";

              }


              codigo =
                String(codigo).trim();


              /*
               * Só aceita leitura com tamanho
               * maior que 8 caracteres.
               *
               * Isso impede pegar somente
               * um EAN-8 incompleto.
               */
              if (
                codigo.length <= 8
              ) {

                mostrarStatus(
                  "Leitura parcial. Continue apontando para o código inteiro..."
                );

                return;
              }


              codigoEncontrado = true;


              if (navigator.vibrate) {

                navigator.vibrate(
                  [100, 60, 100]
                );

              }


              mostrarSucesso(
                "✅ Código encontrado: " +
                codigo
              );


              fecharScanner();


              setTimeout(
                function() {

                  retornarCodigo(
                    codigo
                  );

                },
                700
              );

            }

          }

        );

      }
      catch (erro) {

        console.log(erro);

        fecharScanner();


        if (
          erro.name ===
          "NotAllowedError"
        ) {

          mostrarErro(
            "Permita o acesso à câmera para este site."
          );

        }

        else {

          mostrarErro(
            "Não foi possível abrir a câmera."
          );

        }

      }

    }


    function retornarCodigo(codigo) {

      const separador =
        URL_RETORNO.includes("?")
          ? "&"
          : "?";


      const destino =
        URL_RETORNO +
        separador +
        "tela=produto" +
        "&codigo=" +
        encodeURIComponent(codigo);


      window.location.href =
        destino;

    }


    function fecharScanner() {

      lendo = false;


      if (leitor) {

        try {

          leitor.reset();

        }
        catch (erro) {}

      }


      leitor = null;


      if (stream) {

        stream
          .getTracks()
          .forEach(
            function(track) {

              track.stop();

            }
          );

      }


      stream = null;


      const video =
        document.getElementById("video");


      if (video) {

        video.pause();

        video.srcObject = null;

      }


      const botao =
        document.getElementById(
          "botaoIniciar"
        );


      if (botao) {

        botao.textContent =
          "📷 Abrir câmera";

      }

    }


    function mostrarStatus(texto) {

      const campo =
        document.getElementById("status");

      campo.className =
        "status";

      campo.textContent =
        texto;

    }


    function mostrarErro(texto) {

      const campo =
        document.getElementById("status");

      campo.className =
        "status erro";

      campo.textContent =
        texto;

    }


    function mostrarSucesso(texto) {

      const campo =
        document.getElementById("status");

      campo.className =
        "status sucesso";

      campo.textContent =
        texto;

    }


    window.addEventListener(
      "beforeunload",
      fecharScanner
    );

  </script>

</body>

</html>
