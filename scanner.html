<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <title>Scanner - Raquel Semijoias</title>

  <script
    src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f5f3;
      color: #333;
    }

    .topo {
      background: #b76e79;
      color: white;
      text-align: center;
      padding: 18px;
    }

    .topo h1 {
      margin: 0;
      font-size: 22px;
    }

    .topo p {
      margin: 6px 0 0;
      font-size: 13px;
    }

    .conteudo {
      max-width: 650px;
      margin: auto;
      padding: 15px;
    }

    .camera-box {
      background: #222;
      border-radius: 15px;
      padding: 12px;
    }

    .instrucao {
      color: white;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .video-area {
      position: relative;
      background: black;
      border-radius: 12px;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: auto;
      min-height: 300px;
      max-height: 500px;
      display: block;
      object-fit: contain;
      background: black;
    }

    .moldura {
      position: absolute;
      left: 4%;
      right: 4%;
      top: 38%;
      height: 38%;
      border: 3px solid white;
      border-radius: 10px;
      pointer-events: none;
    }

    .texto-moldura {
      position: absolute;
      left: 5%;
      right: 5%;
      top: 29%;
      text-align: center;
      color: white;
      font-size: 12px;
      text-shadow: 0 1px 5px black;
      pointer-events: none;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      margin-top: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }

    .principal {
      background: #b76e79;
      color: white;
    }

    .capturar {
      background: #d8a8af;
      color: #442d31;
    }

    .secundario {
      background: white;
      color: #72535a;
    }

    .status {
      background: white;
      margin-top: 15px;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      line-height: 1.5;
      word-break: break-word;
    }

    .erro {
      color: #b00020;
      font-weight: bold;
    }

    .sucesso {
      color: #168217;
      font-weight: bold;
    }

    .codigo {
      font-size: 20px;
      margin-top: 8px;
      word-break: break-all;
    }

    .preco {
      font-size: 18px;
      margin-top: 6px;
    }

    .ocr {
      margin-top: 10px;
      padding: 10px;
      background: #f5eeee;
      border-radius: 8px;
      color: #333;
      font-weight: normal;
      word-break: break-all;
    }

    .manual {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-top: 15px;
    }

    .manual h3 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
      text-transform: uppercase;
    }

    canvas {
      display: none;
    }

  </style>

</head>

<body>

  <div class="topo">

    <h1>📷 Scanner</h1>

    <p>Raquel Semijoias</p>

  </div>

  <div class="conteudo">

    <div class="camera-box">

      <div class="instrucao">

        Não precisa aproximar demais.

        <br>

        Deixe a etiqueta na distância em que
        os números e letras fiquem mais nítidos.

      </div>

      <div class="video-area">

        <video
          id="video"
          autoplay
          muted
          playsinline>
        </video>

        <div class="texto-moldura">
          COLOQUE A ETIQUETA INTEIRA NESTA ÁREA
        </div>

        <div class="moldura"></div>

      </div>

      <button
        class="principal"
        onclick="abrirCamera()">

        📷 Abrir câmera

      </button>

      <button
        id="btnCapturar"
        class="capturar"
        onclick="capturarEtiqueta()"
        disabled>

        🔎 Ler etiqueta

      </button>

      <button
        class="secundario"
        onclick="fecharCamera()">

        ✕ Fechar câmera

      </button>

    </div>

    <div
      id="status"
      class="status">

      Abra a câmera e coloque a etiqueta
      inteira dentro do retângulo.

    </div>

    <div class="manual">

      <h3>
        Digitar código manualmente
      </h3>

      <input
        id="codigoManual"
        type="text"
        placeholder="Ex.: 23118843AT04890"
      >

      <button
        class="principal"
        onclick="usarCodigoManual()">

        Usar código

      </button>

    </div>

    <canvas id="canvas"></canvas>

  </div>

  <script>

    let stream = null;

    let processando = false;

    const parametros =
      new URLSearchParams(
        window.location.search
      );

    const URL_RETORNO =
      parametros.get(
        "retorno"
      );


    async function abrirCamera() {

      if (!URL_RETORNO) {

        mostrarErro(
          "Abra o scanner através do sistema Raquel Semijoias."
        );

        return;

      }


      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {

        mostrarErro(
          "Este navegador não permite acesso à câmera."
        );

        return;

      }


      fecharCamera();


      try {

        stream =
          await navigator.mediaDevices.getUserMedia({

            video: {

              facingMode: {
                ideal: "environment"
              },

              width: {
                ideal: 1920
              },

              height: {
                ideal: 1080
              }

            },

            audio: false

          });


        const video =
          document.getElementById(
            "video"
          );


        video.srcObject =
          stream;


        await video.play();


        tentarFocoAutomatico();


        document
          .getElementById(
            "btnCapturar"
          )
          .disabled =
          false;


        mostrarStatus(

          "Câmera aberta.<br><br>" +

          "Afaste ou aproxime até que os caracteres fiquem bem definidos.<br><br>" +

          "Depois toque em <b>Ler etiqueta</b>."

        );

      }

      catch (erro) {

        console.log(
          erro
        );


        if (
          erro.name ===
          "NotAllowedError"
        ) {

          mostrarErro(
            "Permita o acesso à câmera para continuar."
          );

        }

        else {

          mostrarErro(
            "Não foi possível abrir a câmera."
          );

        }

      }

    }


    async function tentarFocoAutomatico() {

      try {

        const track =
          stream
            .getVideoTracks()[0];


        if (!track) {
          return;
        }


        const capabilities =
          track.getCapabilities
            ? track.getCapabilities()
            : {};


        if (
          capabilities.focusMode &&
          capabilities.focusMode.includes(
            "continuous"
          )
        ) {

          await track.applyConstraints({

            advanced: [

              {
                focusMode:
                  "continuous"
              }

            ]

          });

        }

      }

      catch (erro) {

        console.log(
          "Foco automático não disponível."
        );

      }

    }


    async function capturarEtiqueta() {

      if (processando) {
        return;
      }


      const video =
        document.getElementById(
          "video"
        );


      if (
        !video.videoWidth ||
        !video.videoHeight
      ) {

        mostrarErro(
          "A câmera ainda não está pronta."
        );

        return;

      }


      processando =
        true;


      document
        .getElementById(
          "btnCapturar"
        )
        .disabled =
        true;


      mostrarStatus(
        "🔎 Preparando a imagem..."
      );


      try {

        const canvas =
          document.getElementById(
            "canvas"
          );


        const ctx =
          canvas.getContext(
            "2d",
            {
              willReadFrequently: true
            }
          );


        const larguraOriginal =
          video.videoWidth;


        const alturaOriginal =
          video.videoHeight;


        const x =
          Math.floor(
            larguraOriginal * 0.02
          );


        const y =
          Math.floor(
            alturaOriginal * 0.15
          );


        const largura =
          Math.floor(
            larguraOriginal * 0.96
          );


        const altura =
          Math.floor(
            alturaOriginal * 0.70
          );


        const escala =
          2;


        canvas.width =
          largura * escala;


        canvas.height =
          altura * escala;


        ctx.drawImage(

          video,

          x,
          y,

          largura,
          altura,

          0,
          0,

          canvas.width,
          canvas.height

        );


        melhorarImagemSuave(

          ctx,

          canvas.width,

          canvas.height

        );


        mostrarStatus(
          "🔎 Lendo números e letras..."
        );


        const resultado =
          await Tesseract.recognize(

            canvas,

            "eng",

            {

              logger:
                function(m) {

                  if (
                    m.status ===
                    "recognizing text"
                  ) {

                    const progresso =
                      Math.round(
                        (m.progress || 0) *
                        100
                      );


                    mostrarStatus(

                      "🔎 Lendo etiqueta... " +
                      progresso +
                      "%"

                    );

                  }

                }

            }

          );


        const texto =
          resultado.data.text || "";


        console.log(
          "OCR ORIGINAL:",
          texto
        );


        const codigo =
          extrairCodigo(
            texto
          );


        if (!codigo) {

          const textoLimpo =
            String(texto)
              .toUpperCase()
              .replace(
                /[^A-Z0-9]/g,
                ""
              );


          mostrarErro(

            "Não consegui identificar o código completo." +

            "<div class='ocr'>" +

            "<b>O que a câmera reconheceu:</b><br><br>" +

            "<span style='font-size:18px;'>" +
            escaparHtml(texto)
              .replace(/\n/g, "<br>") +
            "</span>" +

            "<br><br>" +

            "<b>Depois da limpeza:</b><br><br>" +

            "<span style='font-size:20px;'>" +
            escaparHtml(textoLimpo) +
            "</span>" +

            "</div>" +

            "<br>Tire um print desta tela e me envie."

          );


          processando =
            false;


          document
            .getElementById(
              "btnCapturar"
            )
            .disabled =
            false;


          return;

        }


        const preco =
          calcularPreco(
            codigo
          );


        mostrarSucesso(

          codigo,

          preco,

          texto

        );


        if (
          navigator.vibrate
        ) {

          navigator.vibrate(
            [100, 60, 100]
          );

        }


        fecharCamera();


        setTimeout(

          function() {

            retornarCodigo(
              codigo
            );

          },

          1800

        );

      }

      catch (erro) {

        console.log(
          erro
        );


        mostrarErro(

          "Ocorreu um erro durante a leitura.<br><br>" +

          "Tente novamente mantendo a etiqueta na distância em que o texto fique mais nítido."

        );


        processando =
          false;


        document
          .getElementById(
            "btnCapturar"
          )
          .disabled =
          false;

      }

    }


    function melhorarImagemSuave(
      ctx,
      largura,
      altura
    ) {

      const imagem =
        ctx.getImageData(

          0,
          0,
          largura,
          altura

        );


      const dados =
        imagem.data;


      for (
        let i = 0;
        i < dados.length;
        i += 4
      ) {

        let cinza =

          dados[i] * 0.299 +

          dados[i + 1] * 0.587 +

          dados[i + 2] * 0.114;


        cinza =
          (cinza - 128) *
          1.25 +
          128;


        cinza =
          Math.max(
            0,
            Math.min(
              255,
              cinza
            )
          );


        dados[i] =
          cinza;


        dados[i + 1] =
          cinza;


        dados[i + 2] =
          cinza;

      }


      ctx.putImageData(

        imagem,

        0,
        0

      );

    }


    function extrairCodigo(texto) {

      const original =
        String(texto)
          .toUpperCase();


      /*
       * Primeiro tentamos por linha.
       * Isso evita juntar textos diferentes
       * que o OCR encontrou na imagem.
       */

      const linhas =
        original
          .split(/\r?\n/)
          .map(
            function(linha) {

              return linha.replace(
                /[^A-Z0-9]/g,
                ""
              );

            }
          )
          .filter(Boolean);


      console.log(
        "LINHAS OCR:",
        linhas
      );


      for (
        let i = 0;
        i < linhas.length;
        i++
      ) {

        const achado =
          encontrarCodigoNaLinha(
            linhas[i]
          );


        if (achado) {

          return achado;

        }

      }


      /*
       * Segunda tentativa:
       * junta tudo.
       */

      const limpo =
        original.replace(
          /[^A-Z0-9]/g,
          ""
        );


      console.log(
        "OCR LIMPO:",
        limpo
      );


      return encontrarCodigoNaLinha(
        limpo
      );

    }


    function encontrarCodigoNaLinha(
      linha
    ) {

      if (!linha) {

        return "";

      }


      /*
       * Formato esperado:
       *
       * 8 números iniciais
       * +
       * letras opcionais
       * +
       * 5 números finais
       *
       * Exemplos:
       *
       * 23118843AT04890
       * 2311884304890
       * 12345678AP07290
       */

      let encontrados =
        linha.match(
          /\d{8}[A-Z]{0,6}\d{5}/g
        );


      if (
        encontrados &&
        encontrados.length
      ) {

        return escolherMelhorCodigo(
          encontrados
        );

      }


      /*
       * Algumas confusões comuns do OCR.
       *
       * Aqui fazemos correções somente
       * para tentar localizar um código.
       */

      const corrigido =
        linha
          .replace(/O/g, "0")
          .replace(/Q/g, "0")
          .replace(/I/g, "1")
          .replace(/L/g, "1");


      encontrados =
        corrigido.match(
          /\d{8}[A-Z0-9]{0,6}\d{5}/g
        );


      if (
        encontrados &&
        encontrados.length
      ) {

        return escolherMelhorCodigo(
          encontrados
        );

      }


      return "";

    }


    function escolherMelhorCodigo(
      codigos
    ) {

      codigos.sort(

        function(a, b) {

          /*
           * Pela etiqueta que estamos trabalhando,
           * códigos entre 13 e 18 caracteres são
           * os mais plausíveis.
           */

          const alvo =
            15;


          return (
            Math.abs(
              a.length - alvo
            ) -
            Math.abs(
              b.length - alvo
            )
          );

        }

      );


      return codigos[0];

    }


    function calcularPreco(
      codigo
    ) {

      if (!codigo) {

        return "";

      }


      const final =
        codigo.slice(
          -5
        );


      if (
        !/^\d{5}$/.test(
          final
        )
      ) {

        return "";

      }


      return (

        Number(final) /
        100

      ).toLocaleString(

        "pt-BR",

        {

          style:
            "currency",

          currency:
            "BRL"

        }

      );

    }


    function usarCodigoManual() {

      let codigo =
        document
          .getElementById(
            "codigoManual"
          )
          .value
          .trim()
          .toUpperCase()
          .replace(
            /\s+/g,
            ""
          );


      if (!codigo) {

        mostrarErro(
          "Digite o código da etiqueta."
        );

        return;

      }


      const final =
        codigo.slice(
          -5
        );


      if (
        !/^\d{5}$/.test(
          final
        )
      ) {

        mostrarErro(
          "Os últimos 5 caracteres precisam ser números."
        );

        return;

      }


      retornarCodigo(
        codigo
      );

    }


    function retornarCodigo(
      codigo
    ) {

      if (!URL_RETORNO) {

        mostrarErro(
          "Não foi possível retornar ao sistema."
        );

        return;

      }


      const separador =
        URL_RETORNO.includes("?")
          ? "&"
          : "?";


      const destino =

        URL_RETORNO +

        separador +

        "tela=produto" +

        "&codigo=" +

        encodeURIComponent(
          codigo
        );


      window.location.href =
        destino;

    }


    function fecharCamera() {

      if (stream) {

        stream
          .getTracks()
          .forEach(

            function(track) {

              track.stop();

            }

          );

      }


      stream =
        null;


      const video =
        document.getElementById(
          "video"
        );


      if (video) {

        video.pause();

        video.srcObject =
          null;

      }


      const botao =
        document.getElementById(
          "btnCapturar"
        );


      if (botao) {

        botao.disabled =
          true;

      }

    }


    function mostrarStatus(
      texto
    ) {

      const campo =
        document.getElementById(
          "status"
        );


      campo.className =
        "status";


      campo.innerHTML =
        texto;

    }


    function mostrarErro(
      texto
    ) {

      const campo =
        document.getElementById(
          "status"
        );


      campo.className =
        "status erro";


      campo.innerHTML =
        texto;

    }


    function mostrarSucesso(
      codigo,
      preco,
      textoOcr
    ) {

      const campo =
        document.getElementById(
          "status"
        );


      campo.className =
        "status sucesso";


      campo.innerHTML =

        "✅ Código reconhecido" +

        "<div class='codigo'>" +

        escaparHtml(
          codigo
        ) +

        "</div>" +

        (

          preco

            ?

            "<div class='preco'>" +
            escaparHtml(
              preco
            ) +
            "</div>"

            :

            ""

        ) +

        "<div class='ocr'>" +

        "<b>OCR detectou:</b><br>" +

        escaparHtml(
          textoOcr
        ).replace(
          /\n/g,
          "<br>"
        ) +

        "</div>";

    }


    function escaparHtml(
      texto
    ) {

      return String(
        texto || ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    window.addEventListener(

      "beforeunload",

      fecharCamera

    );

  </script>

</body>

</html>
